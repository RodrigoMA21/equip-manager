services:
  db:
    image: postgres:16-alpine
    container_name: equipmanager-db
    environment:
      POSTGRES_DB: InventarioRaro
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    container_name: equipmanager-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/InventarioRaro
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: admin
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: equipmanager-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
